<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bahrain3D — Product</title>
  <!-- Legacy URL. Product pages now live at /p/<slug>/. This forwards old shared
       links (product.html?id=...) to the new static page. -->
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/sitegen.js"></script>
  <script>
    (async function () {
      var id = new URLSearchParams(location.search).get("id");
      if (!id) { location.replace("/"); return; }
      try {
        var res = await fetch("/data/products.json");
        var data = await res.json();
        var p = (data.products || []).find(function (x) { return x.id === id; });
        if (p && window.SiteGen) {
          var dest = window.SiteGen.productPath(p, data.products);
          // set a canonical hint before navigating, then forward
          var link = document.createElement("link");
          link.rel = "canonical"; link.href = window.SiteGen.BASE + dest;
          document.head.appendChild(link);
          location.replace(dest);
          return;
        }
      } catch (e) { /* fall through */ }
      location.replace("/");
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px;color:#666">
    Redirecting… If nothing happens, <a href="/">go to the shop</a>.
  </p>
</body>
</html>
